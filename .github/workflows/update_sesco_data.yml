name: Update SESCO data

on:
  workflow_dispatch:
  schedule:
    # 06:00 America/Argentina/Buenos_Aires (UTC-3, sin horario de verano).
    - cron: "0 9 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exploration/requirements.txt

      - name: Install dependencies
        run: pip install -r exploration/requirements.txt

      - name: Update raw from CKAN and regenerate processed data
        run: python exploration/scripts/run_mvp_processing.py --update-raw

      - name: Detect data changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- exploration/data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No hay cambios en exploration/data/; se omite el commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Cambios detectados en exploration/data/."
            git status --short -- exploration/data/
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exploration/data/processed/ exploration/data/raw/latest/
          git commit -m "Actualizazación de datasets procesados de SESCO desde CKAN" -m "Actualización diaria automática mediante GitHub Actions."
          git push
